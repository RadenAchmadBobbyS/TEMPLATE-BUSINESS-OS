version: '3.8'

services:
  # 1. Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - internal_network
    restart: unless-stopped

  # 2. Next.js Web Server (Standalone)
  app:
    build: 
      context: .
      target: runner
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://user:password@db:5432/saas_builder
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - db
      - redis
    networks:
      - internal_network
    restart: unless-stopped
    # Exposing purely to Nginx internally
    expose:
      - "3000"

  # 3. PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: saas_builder
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal_network
    restart: always

  # 4. Redis Cache
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - internal_network
    restart: always

networks:
  internal_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
